<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>변액연금 시뮬레이터 · JW Financial [대외비]</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --navy:#1B3A6B;--navy-l:#2A5298;--navy-pale:#EBF0F8;--navy-deep:#0f2444;
  --amber:#E07B39;--amber-pale:#FDF0E8;
  --green:#1E7A4E;--green-pale:#E8F5EE;
  --red:#B03A3A;--red-pale:#FAEAEA;--red-vivid:#D32F2F;
  --purple:#6B3FA0;--purple-pale:#F0EBF8;
  --bg:#F5F7FA;--surface:#FFFFFF;--border:#DDE4EE;
  --text:#1a1a2e;--muted:#7a8499;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --r:10px;--sh:0 2px 12px rgba(27,58,107,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;}

/* ── HEADER ── */
.app-header{background:var(--navy-deep);color:#fff;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.22);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:30px;height:30px;background:var(--amber);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;}
.logo-text{font-size:15px;font-weight:700;}
.logo-text span{color:var(--amber);font-weight:300;}
.confidential-badge{display:flex;align-items:center;gap:6px;background:rgba(179,47,47,.85);border:1px solid rgba(255,120,120,.4);padding:5px 12px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;}

/* ── LAYOUT ── */
.app-body{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 54px);}

/* ── INPUT PANEL ── */
.input-panel{background:var(--surface);border-right:1px solid var(--border);padding:20px 16px;overflow-y:auto;position:sticky;top:54px;height:calc(100vh - 54px);}
.panel-title{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.input-group{margin-bottom:14px;}
.input-label{font-size:12px;font-weight:500;color:var(--navy);margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;}
.input-hint{font-size:10px;color:var(--muted);font-weight:400;}
.radio-group{display:flex;gap:7px;}
.radio-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;background:var(--bg);user-select:none;}
.radio-btn input{display:none;}
.radio-btn:has(input:checked){border-color:var(--navy);background:var(--navy-pale);color:var(--navy);}
.input-row{display:flex;gap:7px;align-items:center;}
input[type="number"],select{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-family:var(--sans);font-size:13px;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s;-moz-appearance:textfield;}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type="number"]:focus{border-color:var(--navy);background:#fff;}
.input-suffix{font-size:11px;color:var(--muted);white-space:nowrap;min-width:24px;}
input[type="range"]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:2px;outline:none;cursor:pointer;margin-top:5px;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--navy);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer;}
input[type="range"].amber-range::-webkit-slider-thumb{background:var(--amber);}
.slider-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px;}
.slider-value{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--navy);text-align:right;margin-bottom:2px;}
.slider-value.amber{color:var(--amber);}
.divider-line{height:1px;background:var(--border);margin:14px 0;}
.fixed-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:var(--navy-pale);color:var(--navy);padding:7px 11px;border-radius:7px;font-weight:500;width:100%;}
.calc-btn{width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;margin-top:4px;}
.calc-btn:hover{background:var(--navy-l);}
.calc-btn:active{transform:scale(.98);}

/* ── RESULT ── */
.result-panel{padding:22px 24px;overflow-y:auto;}
.section-heading{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.section-heading::before{content:'';width:14px;height:3px;background:var(--amber);border-radius:2px;display:inline-block;}

/* Customer bar */
.customer-bar{background:var(--navy-deep);color:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.customer-name{font-size:15px;font-weight:700;}
.customer-sub{font-size:11px;opacity:.7;margin-top:2px;}
.customer-tags{display:flex;gap:5px;flex-wrap:wrap;}
.ctag{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);font-weight:500;}
.ctag.amber{background:rgba(224,123,57,.3);color:#f9b47a;}
.ctag.green{background:rgba(30,122,78,.3);color:#7fd9a8;}

/* Phase cards */
.phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.phase-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.phase-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border);}
.phase-card.featured::before{background:var(--navy);}
.phase-card.featured{border-color:rgba(27,58,107,.35);box-shadow:0 4px 20px rgba(27,58,107,.12);}
.phase-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:12px;}
.phase-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.phase-row-lbl{font-size:11px;color:var(--muted);}
.phase-row-val{font-size:12px;font-weight:600;color:var(--text);}
.phase-row-val.muted-sm{font-size:10px;color:var(--muted);font-weight:400;}
.phase-sep{height:1px;background:var(--border);margin:10px 0;}
.phase-big{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--navy);margin-top:4px;}
.phase-big-label{font-size:10px;color:var(--muted);margin-bottom:2px;}

/* Pension cards */
.pension-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
.pension-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);}
.pension-card-hd{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
.ptbadge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;}
.b10{background:var(--navy);color:#fff;}
.b20{background:var(--amber);color:#fff;}
.bl10{background:var(--green);color:#fff;}
.bl20{background:var(--purple);color:#fff;}
.pension-period{font-size:10px;color:var(--muted);}
.ptable{width:100%;border-collapse:collapse;}
.ptable thead tr{background:var(--bg);}
.ptable th{font-size:9px;font-weight:500;color:var(--muted);padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);}
.ptable th:not(:first-child){text-align:right;}
.ptable td{padding:8px 10px;font-size:11px;border-bottom:1px solid #f0f3f8;vertical-align:middle;}
.ptable td:not(:first-child){text-align:right;}
.ptable tr:last-child td{border-bottom:none;}
.ptable tr:hover td{background:#fafbfd;}
.monthly-big{font-family:var(--mono);font-size:14px;font-weight:600;}
.c-navy{color:var(--navy);}
.c-amber{color:var(--amber);}
.c-green{color:var(--green);}
.c-purple{color:var(--purple);}
.total-sm{font-size:10px;color:var(--muted);}
.bar-cell{display:flex;align-items:center;gap:5px;}
.mini-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.mini-bar-fill{height:100%;border-radius:2px;}

/* Compare box */
.compare-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px;box-shadow:var(--sh);}
.compare-hd{background:var(--navy);color:#fff;padding:10px 16px;font-size:12px;font-weight:700;}
.compare-grid{display:grid;grid-template-columns:repeat(4,1fr);}
.compare-item{padding:14px;border-right:1px solid var(--border);text-align:center;}
.compare-item:last-child{border-right:none;}
.c-type{font-size:9px;font-weight:700;color:var(--muted);margin-bottom:3px;}
.c-monthly{font-family:var(--mono);font-size:17px;font-weight:600;margin-bottom:2px;}
.c-total{font-size:10px;color:var(--muted);}
.c-note{font-size:10px;color:var(--muted);margin-top:2px;}

/* Rec cards */
.rec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.rec-card{border-radius:var(--r);padding:16px;border:1.5px solid;}
.rec-card.rn{border-color:var(--navy);background:var(--navy-pale);}
.rec-card.ra{border-color:var(--amber);background:var(--amber-pale);}
.rec-card.rp{border-color:var(--purple);background:var(--purple-pale);}
.rec-icon{font-size:20px;margin-bottom:6px;}
.rec-tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;margin-bottom:6px;}
.rec-title{font-size:12px;font-weight:700;margin-bottom:5px;line-height:1.4;}
.rec-desc{font-size:10px;color:var(--muted);line-height:1.7;margin-bottom:8px;}
.rec-result{font-family:var(--mono);font-size:13px;font-weight:600;}


/* ── ETF SECTION ── */
.etf-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px;box-shadow:var(--sh);}
.etf-hd{background:linear-gradient(135deg,#0f2444 0%,#1B3A6B 100%);color:#fff;padding:14px 18px;}
.etf-hd-title{font-size:13px;font-weight:700;margin-bottom:3px;}
.etf-hd-sub{font-size:10px;opacity:.72;line-height:1.6;}
.etf-body{padding:18px 20px;}
.etf-assumption-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding:10px 12px;background:var(--bg);border-radius:7px;}
.etf-tag{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted);}
.etf-tag strong{color:var(--text);font-weight:600;}

/* tax structure boxes */
.tax-struct-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.tax-box{border-radius:8px;padding:12px 14px;}
.tax-box.va-box{background:var(--navy-pale);border:1px solid rgba(27,58,107,.2);}
.tax-box.etf-box{background:#f5f0f8;border:1px solid rgba(107,63,160,.2);}
.tax-box-title{font-size:10px;font-weight:700;margin-bottom:6px;}
.tax-box-body{font-size:11px;line-height:1.8;}

/* 3-col compare */
.etf-3col{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.etf-col{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.etf-col-hd{padding:9px 12px;font-size:10px;font-weight:700;text-align:center;}
.hd-va{background:var(--navy-pale);color:var(--navy);}
.hd-etf{background:#0f2444;color:#fff;}
.hd-diff{background:var(--amber-pale);color:#a06010;}
.etf-row{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-top:1px solid #f0f3f8;font-size:11px;}
.etf-row:first-of-type{border-top:none;}
.etf-row-lbl{font-size:10px;color:var(--muted);}
.etf-row-val{font-family:var(--mono);font-size:12px;font-weight:500;}

/* Prize boxes (소구) */
.prize-section{margin-bottom:20px;}
.prize-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);}
.prize-hd{background:var(--navy);color:#fff;padding:10px 16px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;}
.prize-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;}
.prize-item{padding:14px 12px;border-right:1px solid var(--border);border-top:1px solid var(--border);text-align:center;position:relative;}
.prize-item:nth-child(-n+4){border-top:none;}
.prize-item:nth-child(4n){border-right:none;}
.prize-item.active{background:linear-gradient(135deg,rgba(27,58,107,.06) 0%,rgba(27,58,107,.02) 100%);border-color:rgba(27,58,107,.25);}
.prize-item.active::before{content:'✓ 달성';position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;color:var(--green);background:var(--green-pale);padding:1px 5px;border-radius:10px;}
.prize-emoji{font-size:26px;margin-bottom:4px;}
.prize-amount{font-size:10px;font-weight:700;color:var(--navy);margin-bottom:2px;}
.prize-title{font-size:11px;font-weight:600;color:var(--text);margin-bottom:2px;}
.prize-desc{font-size:9px;color:var(--muted);line-height:1.5;}

/* Tax table */
.tax-table-section{margin-bottom:20px;}
.tax-table-wrap{overflow-x:auto;}
.tax-table{width:100%;border-collapse:collapse;}
.tax-table th{background:var(--bg);font-size:10px;font-weight:600;color:var(--muted);padding:7px 10px;text-align:center;border:1px solid var(--border);}
.tax-table td{padding:8px 10px;font-size:11px;border:1px solid var(--border);text-align:center;}
.tax-table tr.highlighted td{background:var(--red-pale);font-weight:700;color:var(--red-vivid);}
.tax-table tr.highlighted td:first-child::before{content:'▶ ';}
.tax-row-label{font-size:10px;text-align:left!important;}

/* Advantage boxes */
.adv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
.adv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--sh);}
.adv-keyword{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px;line-height:1.2;}
.adv-sub{font-size:11px;color:var(--muted);line-height:1.7;margin-top:6px;}
.adv-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--navy);color:#fff;border-radius:50%;font-size:11px;font-weight:700;margin-right:6px;flex-shrink:0;}

/* Footer */
.result-footer{border-top:1px solid var(--border);padding-top:12px;margin-top:10px;font-size:10px;color:#b0bac8;line-height:1.8;}
.result-footer strong{color:var(--muted);font-weight:500;}

/* Action */
.action-row{display:flex;gap:8px;margin-bottom:18px;}
.action-btn{display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:7px;font-family:var(--sans);font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--navy);transition:all .15s;}
.action-btn:hover{border-color:var(--navy);background:var(--navy-pale);}
.action-btn.primary{background:var(--red);color:#fff;border-color:var(--red);}
.action-btn.primary:hover{background:#922e2e;}

/* Empty */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 40px;color:var(--muted);gap:10px;}

@media(max-width:900px){
  .app-body{grid-template-columns:1fr;}
  .input-panel{position:static;height:auto;}
  .phase-grid,.pension-grid,.rec-grid,.etf-3col,.compare-grid,.adv-grid,.prize-grid{grid-template-columns:1fr;}
}
@media print{
  .app-header,.input-panel,.action-row{display:none!important;}
  .app-body{grid-template-columns:1fr;}
  .result-panel{padding:12px;}
  body{background:#fff;}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">
    <div class="logo-mark">JW</div>
    <div class="logo-text">JW Financial <span>· 변액연금 시뮬레이터</span></div>
  </div>
  <div class="confidential-badge">🔒 대외비 — 사내 전용 자료 · 고객 배포 금지</div>
</div>

<div class="app-body">

<div class="input-panel">
  <div class="panel-title">고객 조건 입력</div>

  <div class="input-group">
    <div class="input-label">성별</div>
    <div class="radio-group">
      <label class="radio-btn"><input type="radio" name="gender" value="M"> 남성</label>
      <label class="radio-btn"><input type="radio" name="gender" value="F" checked> 여성</label>
    </div>
  </div>

  <div class="input-group">
    <div class="input-label">출생연도 <span class="input-hint" id="ageDisplay">만 44세</span></div>
    <div class="input-row">
      <input type="number" id="birthYear" value="1982" min="1940" max="2005">
      <span class="input-suffix">년생</span>
    </div>
  </div>

  <div class="input-group">
    <div class="input-label">월 납입 보험료 <span class="input-hint" id="premDisplay">100만원</span></div>
    <div class="slider-value" id="premVal">1,000,000원</div>
    <input type="range" id="premSlider" min="30" max="300" value="100" step="5">
    <div class="slider-labels"><span>30만</span><span>150만</span><span>300만</span></div>
    <div class="input-row" style="margin-top:7px;">
      <input type="number" id="premInput" value="100" min="30" max="300" step="5">
      <span class="input-suffix">만원</span>
    </div>
  </div>

  <div class="input-group">
    <div class="input-label">납입기간</div>
    <div class="fixed-badge">🔒 10년납 고정</div>
  </div>

  <div class="divider-line"></div>

  <div class="input-group">
    <div class="input-label">연금개시 나이 <span class="input-hint" id="pensionYearHint">2052년</span></div>
    <div class="input-row">
      <input type="number" id="pensionAge" value="70" min="55" max="90">
      <span class="input-suffix">세</span>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px;" id="deferHint">거치기간: 16년</div>
  </div>

  <div class="input-group">
    <div class="input-label">납입기간 평균 수익률</div>
    <div class="slider-value" id="r1Val">8.00%</div>
    <input type="range" id="r1Slider" min="0" max="15" value="8" step="0.05">
    <div class="slider-labels"><span>0%</span><span>7.5%</span><span>15%</span></div>
    <div class="input-row" style="margin-top:7px;">
      <input type="number" id="r1Input" value="8.00" min="0" max="15" step="0.05">
      <span class="input-suffix">%</span>
    </div>
  </div>

  <div class="input-group">
    <div class="input-label">거치기간 평균 수익률</div>
    <div class="slider-value amber" id="r2Val">6.00%</div>
    <input type="range" id="r2Slider" class="amber-range" min="0" max="15" value="6" step="0.05">
    <div class="slider-labels"><span>0%</span><span>7.5%</span><span>15%</span></div>
    <div class="input-row" style="margin-top:7px;">
      <input type="number" id="r2Input" value="6.00" min="0" max="15" step="0.05">
      <span class="input-suffix">%</span>
    </div>
  </div>

  <div class="divider-line"></div>
  <button class="calc-btn" onclick="calculate()">시뮬레이션 실행 →</button>
  <div style="font-size:10px;color:var(--muted);margin-top:6px;text-align:center;">값 변경 시 자동 계산</div>
</div>

<div class="result-panel" id="resultPanel">
  <div class="empty-state" id="emptyState">
    <div style="font-size:40px;opacity:.4;">📊</div>
    <div style="font-size:14px;font-weight:500;">좌측 조건 입력 후 시뮬레이션을 실행하세요</div>
  </div>

let calcTimer=null;
function autoCalc(){clearTimeout(calcTimer);calcTimer=setTimeout(calculate,350);}

/* ── 핵심 계산 ── */
function calcVA(premWon,r1,r2,deferYears){
  const ratio1=1-0.0612-0.15, ratio2=1-0.0314-0.15;
  const net1=Math.max(0,r1-0.0054-0.0005), net2=Math.max(0,r2-0.0054-0.0005);
  const rm1=net1/12, rm2=net2/12;
  // 사업비 합계
  const costTotal=(premWon*0.0612*84)+(premWon*0.0314*36)+(premWon*0.15*120)+(premWon*0.015*deferYears*12);
  let acc=0;
  for(let t=1;t<=120;t++){const ratio=t<=84?ratio1:ratio2;acc=acc*(1+rm1)+premWon*ratio;}
  const bonusLump=premWon*120*0.06;
  const splitM=premWon*12*10*0.0037;
  let splitFV=0;
  for(let t=1;t<=60;t++) splitFV=splitFV*(1+rm2)+splitM;
  const accComp=acc+bonusLump+splitFV;
  const mgmt=premWon*0.015;
  let accP=accComp;
  for(let t=1;t<=deferYears*12;t++){accP=accP*(1+rm2)-mgmt;if(accP<0){accP=0;break;}}
  return{totalPaid:premWon*120,accComp,bonusTotal:bonusLump+splitFV,fund:accP,costTotal};
}

function calcETFTax(gain){
  if(gain<=0) return 0;
  const th=20000000;
  if(gain<=th) return gain*0.154;
  const base=th*0.154;
  const over=gain-th;
  const brackets=[[12000000,.066],[46000000,.165],[88000000,.264],[150000000,.385],[300000000,.418],[500000000,.440],[1000000000,.462],[Infinity,.495]];
  let tax=0,prev=0;
  for(const [lim,rate] of brackets){
    if(over<=prev) break;
    tax+=( Math.min(over,lim)-prev)*rate;
    prev=lim;
    if(over<=lim) break;
  }
  return base+tax;
}

function calcETF(premWon,r1,r2,deferYears){
  const rm1=r1/12, rm2=r2/12;
  let acc=0;
  for(let t=1;t<=120;t++) acc=acc*(1+rm1)+premWon;
  for(let t=1;t<=deferYears*12;t++) acc=acc*(1+rm2);
  const totalCost=premWon*120;
  const gain=Math.max(0,acc-totalCost);
  const tax=calcETFTax(gain);
  return{totalCost,grossFund:acc,gain,tax,afterTax:acc-tax,effRate:gain>0?tax/gain:0,isGlobal:gain>20000000};
}

function calcPension(fund,type,lifeExp){
  const rm=0.0235/12, fee=0.995;
  const af=m=>(1-Math.pow(1+rm,-m))/rm;
  if(type==='10y') return fund/af(120)*fee;
  if(type==='20y') return fund/af(240)*fee;
  const lifeM=Math.round(lifeExp*12);
  if(type==='life10'){const rem=Math.max(0,lifeM-120);return fund/(2*af(120)+(rem>0?af(rem)*Math.pow(1+rm,-120):0))*fee;}
  if(type==='life20'){const rem=Math.max(0,lifeM-240);return fund/(2*af(240)+(rem>0?af(rem)*Math.pow(1+rm,-240):0))*fee;}
  return 0;
}

/* ── 그래프용 시계열 ── */
function buildTS(premWon,r1,r2,deferYears,curAge,pa,receiveYrs){
  const ratio1=1-0.0612-0.15, ratio2=1-0.0314-0.15;
  const net1=Math.max(0,r1-0.0054-0.0005), net2=Math.max(0,r2-0.0054-0.0005);
  const rm1=net1/12, rm2=net2/12, etfRm1=r1/12, etfRm2=r2/12;
  const mgmt=premWon*0.015;
  const ages=[],vaLine=[],etfLine=[],paidLine=[];
  let va=0,etf=0,paid=0;
  const compAge=curAge+10;
  const bonusLump=premWon*120*0.06;
  const splitM=premWon*12*10*0.0037;

  // 납입기간 (연 단위 샘플)
  for(let yr=0;yr<10;yr++){
    for(let m=0;m<12;m++){
      const t=yr*12+m+1;
      const ratio=t<=84?ratio1:ratio2;
      va=va*(1+rm1)+premWon*ratio;
      etf=etf*(1+etfRm1)+premWon;
      paid+=premWon;
    }
    ages.push(curAge+yr+1);vaLine.push(va);etfLine.push(etf);paidLine.push(paid);
  }
  // 납입완료 보너스 즉시 반영
  va+=bonusLump;
  // 거치기간
  let splitCount=0;
  for(let yr=0;yr<deferYears;yr++){
    for(let m=0;m<12;m++){
      va=va*(1+rm2)-mgmt;if(va<0)va=0;
      etf=etf*(1+etfRm2);
      if(splitCount<60){va+=splitM;splitCount++;}
    }
    ages.push(compAge+yr+1);vaLine.push(va);etfLine.push(etf);paidLine.push(paid);
  }
  // 연금개시 시점 = pa세
  // ETF 세후 재원
  const etfGain=Math.max(0,etf-paid);
  const etfTax=calcETFTax(etfGain);
  const etfAfterTax=etf-etfTax;
  // 연금개시 시점 데이터 포인트 (pa세)는 이미 deferYears 루프에서 추가됨
  // 수령기간: receiveYrs년, x축은 pa+receiveYrs까지
  const vaFundAtPension=va;
  const etfFundAtPension=etfAfterTax;
  // 마지막 포인트가 pa세, 이후 수령기간 동안 잔액 감소 시뮬
  // 변액연금: 확정 10년형 기준 월 수령액
  const rm=0.0235/12;
  const afRec=(1-Math.pow(1+rm,-(receiveYrs*12)))/rm;
  const vaMonthly=(vaFundAtPension/afRec)*0.995;
  const etfMonthly=etfFundAtPension/(receiveYrs*12);
  let vaR2=vaFundAtPension, etfR2=etfFundAtPension;
  for(let yr=0;yr<receiveYrs;yr++){
    for(let m=0;m<12;m++){vaR2-=vaMonthly;etfR2-=etfMonthly;if(vaR2<0)vaR2=0;if(etfR2<0)etfR2=0;}
    ages.push(pa+yr+1);vaLine.push(vaR2);etfLine.push(etfR2);paidLine.push(null);
  }
  return{ages,vaLine,etfLine,paidLine,compAge,pa,vaAtPension:vaFundAtPension,etfAfterTax:etfFundAtPension};
}

function savePDF(){
  const el=document.getElementById('resultContent');
  const btns=document.querySelectorAll('.action-btn');
  btns.forEach(b=>b.style.display='none');
  const by=document.getElementById('birthYear').value;
  const pa=document.getElementById('pensionAge').value;
  const pm=document.getElementById('premInput').value;
  html2pdf().set({
    margin:[8,6],
    filename:`[대외비]변액연금시뮬레이션_${by}년생_${pa}세개시_${pm}만원.pdf`,
    image:{type:'jpeg',quality:0.95},
    html2canvas:{scale:2,useCORS:true,scrollY:0},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
    pagebreak:{mode:['avoid-all','css','legacy']}
  }).from(el).save().then(()=>btns.forEach(b=>b.style.display=''));
}
